<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232b59c3'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#15181e; --muted:#5d6573; --faint:#8a93a2; --line:#e3e6ec;
  --accent:#2b59c3; --accent-ink:#fff; --accent-soft:#e8eefb;
  --you:#b45309; --you-soft:#fdf1e0; --ok:#15803d; --ok-soft:#e5f5ea; --bad:#b91c1c; --bad-soft:#fbe9e9;
  --work:#2b59c3; --work-soft:#e8eefb; --idle:#6b7280; --idle-soft:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --panel:#171a21; --ink:#e8eaee; --muted:#a1a8b5; --faint:#727a88; --line:#272b35;
    --accent:#6d93f0; --accent-ink:#0b0f18; --accent-soft:#1c2640;
    --you:#f0a24a; --you-soft:#33240f; --ok:#4ade80; --ok-soft:#12291b; --bad:#f87171; --bad-soft:#331616;
    --work:#6d93f0; --work-soft:#1c2640; --idle:#9aa1ad; --idle-soft:#22262e; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-grid;place-items:center}
.sync{margin-left:auto;color:var(--faint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.ok{color:#08130c}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px}
.icon-btn:hover{background:var(--idle-soft);color:var(--ink)}
main{padding:24px 0 64px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat.you b{color:var(--you)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .count{background:var(--you-soft);color:var(--you);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
section{margin-bottom:32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.need{padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start;border-left:3px solid var(--you);margin-bottom:10px}
.need .meta{color:var(--muted);font-size:13px}
.need h3{margin:2px 0 4px;font-size:16px}
.need p{margin:0;color:var(--muted);white-space:pre-wrap}
.need .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.need .note{grid-column:1/-1;display:none;gap:8px}
.need.noting .note{display:flex}
.need .note input{flex:1;min-width:0}
@media (max-width:640px){.need{grid-template-columns:1fr}.need .actions{justify-content:flex-start}}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.empty{padding:20px;color:var(--muted);text-align:center}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.agents{grid-template-columns:1fr}}
.agent{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.agent-top{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.agent-top h3{margin:0;font-size:16px;line-height:1.2}
.agent-top small{color:var(--faint);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-working,.s-doing{background:var(--work-soft);color:var(--work)}
.s-idle,.s-todo{background:var(--idle-soft);color:var(--idle)}
.s-blocked,.s-rejected{background:var(--bad-soft);color:var(--bad)}
.s-done,.s-confirmed{background:var(--ok-soft);color:var(--ok)}
.s-needs-you{background:var(--you-soft);color:var(--you)}
.agent-top .pill{margin-left:auto}
.summary{margin:0;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--idle-soft);border-radius:99px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks li{border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:none}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;min-width:0}
.trow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.trow .when{color:var(--faint);font-size:12px;white-space:nowrap}
.tdetail{display:none;padding:0 0 12px;font-size:13px;color:var(--muted)}
li.open .tdetail{display:block}
.tdetail p{margin:0 0 6px;white-space:pre-wrap}
.log{list-style:none;margin:6px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line)}
.log li{border:none;padding:2px 0}
.log time{color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.more{background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:13px;text-align:left}
.msg{display:flex;gap:8px}
.msg input{font-size:14px}
.msgs{font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.msgs li{padding:2px 0}
.msgs b{color:var(--ink);font-weight:600}
.done-list .row{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.done-list .row:last-child{border-bottom:none}
.done-list .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-list .row small{color:var(--faint);white-space:nowrap}
/* connect */
.connect{max-width:560px;margin:40px auto;padding:24px}
.connect h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.connect p{color:var(--muted);margin:0 0 16px}
.connect label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.connect ol{color:var(--muted);padding-left:20px;margin:0 0 4px;font-size:14px}
.connect .row{display:flex;gap:8px;margin-top:18px;align-items:center}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;margin:8px 0 0;white-space:pre}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:20px;max-width:min(680px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 8px}
dialog p{color:var(--muted);margin:8px 0}
.brand{white-space:nowrap}
@media (max-width:560px){.sync{display:none}#connectAgentBtn{margin-left:auto;padding:6px 8px}header .wrap{gap:4px}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><i><svg width="14" height="14" viewBox="0 0 32 32"><path d="M7 17l6 6 12-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Agent Hub</div>
  <div class="sync" id="sync"></div>
  <a class="btn ghost" id="issuesLink" target="_blank" rel="noopener" style="text-decoration:none" hidden>All tasks in GitHub ↗</a>
  <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
</div></header>

<main class="wrap" id="app"><div class="card empty">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data = null;
const openAgents = new Set();

function ago(t){
  if(!t) return "";
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  if (s < 86400*7) return Math.floor(s/86400) + "d ago";
  return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const label = s => ({ "needs-you":"needs you", doing:"in progress" }[s] || s);
const issueURL = n => `https://github.com/${data.repo}/issues/${n}`;

async function load(quiet){
  if (!quiet) $("#sync").textContent = "Updating…";
  try {
    const r = await fetch(`hub.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "No data published yet." : `HTTP ${r.status}`);
    data = await r.json();
    render();
  } catch (e) {
    $("#sync").textContent = "";
    if (!data) $("#app").innerHTML = `<div class="card empty">Couldn't load the hub: ${esc(e.message)}<br><small>It fills in after your agents' first update.</small></div>`;
  }
}

function render(){
  const all = data.agents.flatMap(a => a.tasks.map(t => ({ a, t })));
  const needs = all.filter(x => x.t.state === "needs-you").sort((x,y) => x.t.created < y.t.created ? -1 : 1);
  const weekAgo = Date.now() - 7*864e5;
  const recent = all.filter(x => ["confirmed","rejected","done"].includes(x.t.state) && new Date(x.t.updated) > weekAgo)
                    .sort((x,y) => x.t.updated < y.t.updated ? 1 : -1);
  const working = data.agents.filter(a => a.status === "working").length;
  $("#issuesLink").href = `https://github.com/${data.repo}/issues?q=is%3Aopen+label%3Aneeds-you`;
  $("#issuesLink").hidden = false;

  $("#app").innerHTML = `
    <div class="stats">
      <div class="stat you"><b>${needs.length}</b><span>Waiting on you</span></div>
      <div class="stat"><b>${working}<small style="font-size:15px;color:var(--faint)"> / ${data.agents.length}</small></b><span>Agents working</span></div>
      <div class="stat"><b>${all.filter(x => x.t.state === "done" && new Date(x.t.updated) > weekAgo).length}</b><span>Agent tasks done · 7d</span></div>
      <div class="stat"><b>${all.filter(x => x.t.state === "confirmed" && new Date(x.t.updated) > weekAgo).length}</b><span>You confirmed · 7d</span></div>
    </div>

    <section>
      <h2>Waiting on you ${needs.length ? `<span class="count">${needs.length}</span>` : ""}</h2>
      ${needs.length ? needs.map(({a,t}) => `
        <div class="card need">
          <div>
            <div class="meta">${esc(a.name)} · asked ${ago(t.created)}</div>
            <h3>${esc(t.title)}</h3>
          </div>
          <div class="actions">
            ${t.issue ? `<a class="btn ok" style="text-decoration:none" href="${issueURL(t.issue)}" target="_blank" rel="noopener">Open &amp; mark done ↗</a>`
                      : `<span class="meta">Opening in GitHub…</span>`}
          </div>
        </div>`).join("") : `<div class="card empty">Nothing waiting on you. 🎉</div>`}
      ${needs.length ? `<p class="meta" style="color:var(--muted);font-size:13px;margin:6px 2px 0">Opens the task in GitHub. There, <b>Close issue</b> = done · <b>Close as not planned</b> = reject · a comment = note for the agent. This page updates about a minute later.</p>` : ""}
    </section>

    <section>
      <h2>Agents</h2>
      ${data.agents.length ? `<div class="agents">${data.agents.slice().sort((x,y)=> x.updated < y.updated ? 1 : -1).map(agentCard).join("")}</div>`
        : `<div class="card empty">No agents connected yet.</div>`}
    </section>

    <section>
      <h2>Recently finished · 7 days</h2>
      ${recent.length ? `<div class="card done-list">${recent.slice(0,25).map(x => `
        <div class="row"><span class="pill s-${x.t.state}">${label(x.t.state)}</span><span class="t">${esc(x.t.title)}</span>
        <small>${esc(x.a.name)} · ${ago(x.t.updated)}</small></div>`).join("")}</div>`
        : `<div class="card empty">Nothing finished in the last week.</div>`}
    </section>`;
  $("#sync").textContent = `Updated ${ago(data.generated)}`;
}

function agentCard(a){
  const order = { "needs-you":0, doing:1, blocked:2, todo:3, done:4, confirmed:4, rejected:5 };
  const tasks = a.tasks.slice().sort((x,y) => (order[x.state]-order[y.state]) || (x.updated < y.updated ? 1 : -1));
  const n = tasks.length || 1, cnt = k => tasks.filter(t => k.includes(t.state)).length;
  const bars = [["done,confirmed","var(--ok)"],["doing","var(--work)"],["needs-you","var(--you)"],["blocked,rejected","var(--bad)"]]
    .map(([k,c]) => `<i style="width:${cnt(k.split(","))/n*100}%;background:${c}"></i>`).join("");
  const all = openAgents.has(a.agent), visible = all ? tasks : tasks.slice(0, 6);
  return `<div class="card agent">
    <div class="agent-top">
      <div class="avatar">${esc((a.name||a.agent).trim()[0].toUpperCase())}</div>
      <div style="min-width:0"><h3>${esc(a.name)}</h3><small>updated ${ago(a.updated)}</small></div>
      <span class="pill s-${esc(a.status)}">${esc(a.status)}</span>
    </div>
    ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
    ${tasks.length ? `<div class="progress">${bars}</div><ul class="tasks">${visible.map(t => `
      <li><div class="trow" style="cursor:default"><span class="pill s-${t.state}">${label(t.state)}</span>
        <span class="t">${t.issue ? `<a href="${issueURL(t.issue)}" target="_blank" rel="noopener" style="color:inherit">${esc(t.title)}</a>` : esc(t.title)}</span>
        <span class="when">${ago(t.updated)}</span></div></li>`).join("")}</ul>` : `<p class="summary">No tasks yet.</p>`}
    ${tasks.length > 6 ? `<button class="more" data-agent="${esc(a.agent)}">${all ? "Show less" : `Show all ${tasks.length}`}</button>` : ""}
    ${a.status_issue ? `<a class="more" style="text-decoration:none" href="${issueURL(a.status_issue)}" target="_blank" rel="noopener">Details &amp; message this agent in GitHub ↗</a>` : ""}
  </div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.more[data-agent]"); if (!b) return;
  openAgents.has(b.dataset.agent) ? openAgents.delete(b.dataset.agent) : openAgents.add(b.dataset.agent); render();
});
$("#refreshBtn").onclick = () => load();
setInterval(() => document.visibilityState === "visible" && load(true), 30000);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && load(true));
load();
})();
</script>
</body>
</html>
